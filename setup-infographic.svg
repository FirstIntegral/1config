  <rect width="1600" height="1560" fill="#0d1117"/>
  <rect width="1600" height="1560" fill="url(#grid)"/>

  <!-- ===== title ===== -->
  <text x="800" y="56" text-anchor="middle" font-size="30" font-weight="bold" fill="url(#acc)" letter-spacing="5">UNIFIED AI TERMINAL SETUP</text>
  <rect x="520" y="70" width="560" height="3" rx="1.5" fill="url(#acc)"/>
  <text x="800" y="96" text-anchor="middle" font-size="14" fill="#8b949e">3 AI tools · 1 canonical rules file · Omarchy + Ubuntu · updated 2026-08-29 — README + SETUP.md; figure same-turn when the brain changes</text>

  <!-- ===== converging symlink arrows ===== -->
  <line x1="310" y1="268" x2="700" y2="330" stroke="#39d3e0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="442" y="288" font-size="11" fill="#8b949e">symlink</text>
  <line x1="800" y1="268" x2="800" y2="322" stroke="#39d3e0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="812" y="300" font-size="11" fill="#8b949e">symlink</text>
  <line x1="1290" y1="268" x2="900" y2="330" stroke="#39d3e0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="1130" y="288" font-size="11" fill="#8b949e">symlink</text>

  <!-- ===== GROK ===== -->
  <rect x="130" y="130" width="360" height="138" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <circle cx="468" cy="152" r="5" fill="#39d3e0"/>
  <text x="152" y="162" font-size="15" font-weight="bold" fill="#e6edf3">GROK</text>
  <text x="152" y="186" font-size="13" fill="#79c0ff">~/.grok/AGENTS.md</text>
  <text x="152" y="210" font-size="12" fill="#3fb950">native project AGENTS.md ✓</text>
  <text x="152" y="230" font-size="12" fill="#8b949e">claude-compat <tspan fill="#d29922">OFF</tspan> · memory <tspan fill="#d29922">OFF</tspan></text>
  <text x="152" y="250" font-size="12" fill="#8b949e">[ui] always-approve · Bash buckets fanned out</text>

  <!-- ===== CLAUDE ===== -->
  <rect x="620" y="130" width="360" height="138" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <circle cx="958" cy="152" r="5" fill="#39d3e0"/>
  <text x="642" y="162" font-size="15" font-weight="bold" fill="#e6edf3">CLAUDE CODE</text>
  <text x="642" y="186" font-size="13" fill="#79c0ff">~/.claude/CLAUDE.md (global symlink)</text>
  <text x="642" y="210" font-size="12" fill="#3fb950">project AGENTS.md via SessionStart hook ✓</text>
  <text x="642" y="230" font-size="12" fill="#8b949e">auto-memory <tspan fill="#d29922">DISABLED</tspan> · stubs only</text>
  <text x="642" y="250" font-size="12" fill="#8b949e">heredoc-rewrite PreToolUse hook</text>

  <!-- ===== OPENCODE ===== -->
  <rect x="1110" y="130" width="360" height="138" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <circle cx="1448" cy="152" r="5" fill="#39d3e0"/>
  <text x="1132" y="162" font-size="15" font-weight="bold" fill="#e6edf3">OPENCODE</text>
  <text x="1132" y="186" font-size="13" fill="#79c0ff">~/.config/opencode/AGENTS.md</text>
  <text x="1132" y="210" font-size="12" fill="#3fb950">native AGENTS.md · zero config ✓</text>
  <text x="1132" y="230" font-size="12" fill="#8b949e">opencode.jsonc = permissions fan-out</text>
  <text x="1132" y="250" font-size="12" fill="#8b949e">edit=allow · bash *=allow (last-match wins)</text>

  <!-- ===== HUB ===== -->
  <rect x="580" y="338" width="440" height="196" rx="10" fill="none" stroke="#39d3e0" stroke-width="2.5" opacity="0.55" filter="url(#glow)"/>
  <rect x="580" y="338" width="440" height="196" rx="10" fill="#161b22" stroke="#39d3e0" stroke-width="2.5"/>
  <text x="800" y="368" text-anchor="middle" font-size="19" font-weight="bold" fill="#39d3e0">~/.agents/AGENTS.md</text>
  <text x="800" y="390" text-anchor="middle" font-size="12" fill="#8b949e">CANONICAL GLOBAL RULES — edit here (or via any symlink)</text>
  <text x="612" y="416" font-size="12" fill="#f85149">HARD: no AI attribution in commits/PRs</text>
  <text x="612" y="436" font-size="12" fill="#f85149">HARD: never bypass GPG commit signing</text>
  <text x="612" y="456" font-size="12" fill="#f85149">HARD: transcript = user-only, AI never reads</text>
  <text x="612" y="476" font-size="12" fill="#e6edf3">caveman mode always on · tri-tool parity</text>
  <text x="612" y="496" font-size="12" fill="#e6edf3">triggers: create · continue · checkpoint ·</text>
  <text x="612" y="516" font-size="12" fill="#e6edf3">writepaper · global_brain_update</text>

  <!-- ===== CRON GUARDS ===== -->
  <rect x="1110" y="338" width="360" height="196" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="1132" y="368" font-size="15" font-weight="bold" fill="#e6edf3">CRON GUARDS + UPDATER</text>
  <text x="1132" y="390" font-size="12" fill="#79c0ff">agents-symlink-guard @daily+@reboot</text>
  <text x="1132" y="410" font-size="12" fill="#8b949e">heals 3 AGENTS.md symlinks · flock'd</text>
  <text x="1132" y="430" font-size="12" fill="#79c0ff">merge-strays.sh @daily (headless LLM)</text>
  <text x="1132" y="450" font-size="12" fill="#8b949e">quarantined strays → merged → canonical</text>
  <text x="1132" y="470" font-size="12" fill="#79c0ff">claude-memory-guard @daily+@reboot</text>
  <text x="1132" y="490" font-size="12" fill="#8b949e">residue → archive → stage → wipe to stub</text>
  <text x="1132" y="510" font-size="12" fill="#79c0ff">tool updater @reboot + resume shim</text>
  <text x="1132" y="526" font-size="12" fill="#8b949e">skips mise-managed · refreshes inventory</text>
  <line x1="1110" y1="430" x2="1024" y2="430" stroke="#39d3e0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="1030" y="418" font-size="11" fill="#8b949e">heals</text>

  <!-- ===== SETUP ===== -->
  <rect x="130" y="338" width="360" height="196" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="152" y="368" font-size="15" font-weight="bold" fill="#e6edf3">FRESH MACHINE</text>
  <text x="152" y="392" font-size="13" fill="#3fb950">git clone → bash setup.sh (either distro)</text>
  <text x="152" y="416" font-size="12" fill="#8b949e">idempotent · backs up replaced files</text>
  <text x="152" y="436" font-size="12" fill="#8b949e">symlinks · grok cfg · mem wipe · hooks</text>
  <text x="152" y="456" font-size="12" fill="#8b949e">guards + updater + cron · gpg hooks</text>
  <text x="152" y="476" font-size="12" fill="#8b949e">permissions.json → 3-tool fan-out</text>
  <text x="152" y="496" font-size="12" fill="#79c0ff">SETUP.md = spec · verify.sh = gate</text>
  <text x="152" y="516" font-size="12" fill="#8b949e">git-versioned (private repo 1config)</text>
  <line x1="490" y1="436" x2="576" y2="436" stroke="#39d3e0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="510" y="424" font-size="11" fill="#8b949e">creates</text>

  <!-- ===== arrow hub -> binary/permissions/signing band ===== -->
  <line x1="800" y1="534" x2="800" y2="560" stroke="#39d3e0" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ===== BINARY LAYER ===== -->
  <rect x="130" y="568" width="430" height="150" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="152" y="596" font-size="15" font-weight="bold" fill="#e6edf3">BINARY LAYER — mise</text>
  <text x="152" y="620" font-size="12" fill="#8b949e">tools = latest + 24h minimum_release_age</text>
  <text x="152" y="640" font-size="12" fill="#8b949e">updater skips mise-managed (shims shadow)</text>
  <text x="152" y="660" font-size="12" fill="#3fb950">inventory + verify probe bash -lc ✓</text>
  <text x="152" y="680" font-size="12" fill="#8b949e">one resolution ⇒ no caller-env drift</text>
  <text x="152" y="700" font-size="12" fill="#8b949e">versions table lives in SETUP.md only</text>

  <!-- ===== SIGNING CHAIN ===== -->
  <rect x="585" y="568" width="430" height="150" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="607" y="596" font-size="15" font-weight="bold" fill="#e6edf3">SIGNING CHAIN</text>
  <text x="607" y="620" font-size="12" fill="#8b949e">dedicated gpg-signing collection (autologin)</text>
  <text x="607" y="640" font-size="12" fill="#8b949e">→ gpg-agent-unlock.sh (boot + migrate)</text>
  <text x="607" y="660" font-size="12" fill="#8b949e">→ every commit signed · never bypassed</text>
  <text x="607" y="680" font-size="12" fill="#79c0ff">sync.sh: setup+verify → commit → push</text>
  <text x="607" y="700" font-size="12" fill="#8b949e">→ github:FirstIntegral/1config (main)</text>

  <!-- ===== PERMISSIONS ===== -->
  <rect x="1040" y="568" width="430" height="150" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="1062" y="596" font-size="15" font-weight="bold" fill="#e6edf3">PERMISSIONS — canonical</text>
  <text x="1062" y="620" font-size="12" fill="#79c0ff">permissions.json → allow / ask / deny</text>
  <text x="1062" y="640" font-size="12" fill="#8b949e">claude settings · grok toml · opencode jsonc</text>
  <text x="1062" y="660" font-size="12" fill="#8b949e">verify byte-checks all three vs canonical</text>
  <text x="1062" y="680" font-size="12" fill="#3fb950">edit_without_prompt = true ✓</text>
  <text x="1062" y="700" font-size="12" fill="#d29922">bash_without_prompt = true (flip in json)</text>

  <!-- ===== arrow band -> project ===== -->
  <line x1="800" y1="718" x2="800" y2="748" stroke="#39d3e0" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ===== PER-PROJECT STANDARD ===== -->
  <rect x="130" y="756" width="1340" height="430" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="800" y="790" text-anchor="middle" font-size="17" font-weight="bold" fill="#e6edf3">PER-PROJECT — AGENTS · compact · transcript · DECISIONS · .gitignore (NO CLAUDE.md)</text>

  <!-- AGENTS.md -->
  <rect x="160" y="812" width="627" height="100" rx="8" fill="#0d1117" stroke="#39d3e0" stroke-width="1.5"/>
  <text x="180" y="840" font-size="14" font-weight="bold" fill="#39d3e0">AGENTS.md</text>
  <text x="180" y="862" font-size="12" fill="#e6edf3">canonical + ONLY project rules file — all tools (Claude via hook)</text>
  <text x="180" y="882" font-size="12" fill="#8b949e">## Repo line documents remote (git config always wins)</text>
  <text x="180" y="900" font-size="12" fill="#8b949e">sites repos: kept local, never committed</text>

  <!-- DECISIONS.md -->
  <rect x="813" y="812" width="627" height="100" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <text x="833" y="840" font-size="14" font-weight="bold" fill="#e6edf3">docs/DECISIONS.md</text>
  <text x="833" y="862" font-size="12" fill="#e6edf3">ADR log — decision + why + rejected alternatives</text>
  <text x="833" y="882" font-size="12" fill="#8b949e">appended same turn a choice is made</text>
  <text x="833" y="900" font-size="12" fill="#3fb950">versioned — committed in repos ✓</text>

  <!-- session_compact -->
  <rect x="160" y="932" width="627" height="118" rx="8" fill="#0d1117" stroke="#3fb950" stroke-width="1.5"/>
  <text x="180" y="960" font-size="14" font-weight="bold" fill="#3fb950">session_compact.md — AI HANDOFF</text>
  <text x="180" y="982" font-size="12" fill="#e6edf3">read FIRST at session start · REWRITE at end / milestone</text>
  <text x="180" y="1002" font-size="12" fill="#8b949e">state · left-off · next step · decisions · open issues</text>
  <text x="180" y="1022" font-size="12" fill="#8b949e">Models used = CUMULATIVE list (model + effort)</text>
  <text x="180" y="1040" font-size="12" fill="#d29922">local-only — never commit unless user says otherwise</text>

  <!-- session_transcript -->
  <rect x="813" y="932" width="627" height="118" rx="8" fill="#0d1117" stroke="#f85149" stroke-width="1.5"/>
  <text x="833" y="960" font-size="14" font-weight="bold" fill="#f85149">session_transcript.md — HUMAN ONLY</text>
  <text x="833" y="982" font-size="12" fill="#e6edf3">append-only narrative log, newest at bottom — FOR the user</text>
  <text x="833" y="1002" font-size="12" fill="#f85149">AI NEVER reads it unless user explicitly asks (HARD RULE)</text>
  <text x="833" y="1022" font-size="12" fill="#8b949e">AI appends at milestones — writing OK, reading NOT</text>
  <text x="833" y="1040" font-size="12" fill="#d29922">local-only — never commit unless user says otherwise</text>

  <!-- workflow strip -->
  <rect x="160" y="1070" width="1280" height="92" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <text x="180" y="1098" font-size="13" font-weight="bold" fill="#e6edf3">SESSION LOOP</text>
  <text x="330" y="1098" font-size="12" fill="#8b949e">start: residue check → compact → AGENTS.md → DECISIONS.md (never transcript)</text>
  <text x="330" y="1120" font-size="12" fill="#8b949e">during: choice → ADR same turn · durable fact → AGENTS.md · milestone → append transcript</text>
  <text x="330" y="1142" font-size="12" fill="#8b949e">end: checkpoint.sh (commit/push by repo state) · rewrite compact · detached runs get watch-stale</text>

  <!-- ===== GITHUB POLICY ===== -->
  <rect x="130" y="1210" width="1340" height="110" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="800" y="1242" text-anchor="middle" font-size="17" font-weight="bold" fill="#e6edf3">GITHUB POLICY</text>
  <text x="160" y="1270" font-size="12" fill="#e6edf3">only <tspan fill="#79c0ff">~/projects/sites/*</tspan> repos + this setup (<tspan fill="#79c0ff">1config</tspan>, private) live on GitHub — remotes are a manual decision, never created by tooling</text>
  <text x="160" y="1292" font-size="12" fill="#f85149">every commit GPG-signed · no AI attribution ever · session files NEVER pushed · push failures never force-retried</text>

  <!-- ===== footer ===== -->
  <text x="800" y="1372" text-anchor="middle" font-size="13" fill="#8b949e">memory: shared markdown only · tool-internal stores disabled · residue staged by cron, merged by AI</text>
  <text x="800" y="1396" text-anchor="middle" font-size="13" fill="#8b949e">papers: writepaper_project → docs/paper/ (LaTeX, no citations, no invented numbers) · kept current same-turn</text>
  <text x="800" y="1428" text-anchor="middle" font-size="14" fill="#39d3e0">migrate: cp -r ~/.agents/ → bash ~/.agents/setup.sh → bash ~/.agents/sync.sh -m "…" → done</text>
  <text x="800" y="1456" text-anchor="middle" font-size="11" fill="#8b949e">figure = visual summary only · SETUP.md is the authoritative spec · regenerate figure same-turn when the brain's shape changes</text>
</svg>
