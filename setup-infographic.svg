<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1560" viewBox="0 0 1600 1560" font-family="DejaVu Sans Mono, monospace">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#1c2128"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#39d3e0"/>
    </marker>
  </defs>

  <rect width="1600" height="1560" fill="#0d1117"/>
  <rect width="1600" height="1560" fill="url(#grid)"/>

  <!-- ===== title ===== -->
  <text x="800" y="58" text-anchor="middle" font-size="30" font-weight="bold" fill="#39d3e0" letter-spacing="5">UNIFIED AI TERMINAL SETUP</text>
  <text x="800" y="88" text-anchor="middle" font-size="14" fill="#8b949e">3 AI tools · 1 canonical rules file · linux · updated 2026-08-02 — hand this SVG + ~/.agents/ to any AI to recreate</text>

  <!-- ===== converging symlink arrows ===== -->
  <line x1="310" y1="268" x2="700" y2="330" stroke="#39d3e0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="442" y="288" font-size="11" fill="#8b949e">symlink</text>
  <line x1="800" y1="268" x2="800" y2="322" stroke="#39d3e0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="812" y="300" font-size="11" fill="#8b949e">symlink</text>
  <line x1="1290" y1="268" x2="900" y2="330" stroke="#39d3e0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="1130" y="288" font-size="11" fill="#8b949e">symlink</text>

  <!-- ===== GROK ===== -->
  <rect x="130" y="130" width="360" height="138" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <circle cx="468" cy="152" r="5" fill="#39d3e0"/>
  <text x="152" y="162" font-size="15" font-weight="bold" fill="#e6edf3">GROK <tspan fill="#8b949e" font-size="12" font-weight="normal">0.2.118</tspan></text>
  <text x="152" y="186" font-size="13" fill="#79c0ff">~/.grok/AGENTS.md</text>
  <text x="152" y="210" font-size="12" fill="#3fb950">native project AGENTS.md ✓</text>
  <text x="152" y="230" font-size="12" fill="#8b949e">claude-compat <tspan fill="#d29922">OFF</tspan> (no double-read)</text>
  <text x="152" y="250" font-size="12" fill="#8b949e">memory        <tspan fill="#d29922">OFF</tspan> (shared md only)</text>

  <!-- ===== CLAUDE ===== -->
  <rect x="620" y="130" width="360" height="138" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <circle cx="958" cy="152" r="5" fill="#39d3e0"/>
  <text x="642" y="162" font-size="15" font-weight="bold" fill="#e6edf3">CLAUDE CODE <tspan fill="#8b949e" font-size="12" font-weight="normal">2.1.220</tspan></text>
  <text x="642" y="186" font-size="13" fill="#79c0ff">~/.claude/CLAUDE.md (global symlink)</text>
  <text x="642" y="210" font-size="12" fill="#3fb950">project AGENTS.md via SessionStart hook ✓</text>
  <text x="642" y="230" font-size="12" fill="#8b949e">auto-memory <tspan fill="#d29922">DISABLED</tspan> · # unused</text>
  <text x="642" y="250" font-size="12" fill="#8b949e">hooks/load-project-agents.sh</text>

  <!-- ===== OPENCODE ===== -->
  <rect x="1110" y="130" width="360" height="138" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <circle cx="1448" cy="152" r="5" fill="#39d3e0"/>
  <text x="1132" y="162" font-size="15" font-weight="bold" fill="#e6edf3">OPENCODE <tspan fill="#8b949e" font-size="12" font-weight="normal">1.18.11</tspan></text>
  <text x="1132" y="186" font-size="13" fill="#79c0ff">~/.config/opencode/AGENTS.md</text>
  <text x="1132" y="210" font-size="12" fill="#3fb950">native AGENTS.md · zero config ✓</text>
  <text x="1132" y="230" font-size="12" fill="#8b949e">opencode.jsonc untouched</text>

  <!-- ===== HUB ===== -->
  <rect x="580" y="338" width="440" height="196" rx="10" fill="none" stroke="#39d3e0" stroke-width="2.5" opacity="0.55" filter="url(#glow)"/>
  <rect x="580" y="338" width="440" height="196" rx="10" fill="#161b22" stroke="#39d3e0" stroke-width="2.5"/>
  <text x="800" y="368" text-anchor="middle" font-size="19" font-weight="bold" fill="#39d3e0">~/.agents/AGENTS.md</text>
  <text x="800" y="390" text-anchor="middle" font-size="12" fill="#8b949e">CANONICAL GLOBAL RULES — edit here (or via any symlink)</text>
  <text x="612" y="416" font-size="12" fill="#f85149">HARD: no AI attribution in commits/PRs</text>
  <text x="612" y="436" font-size="12" fill="#f85149">HARD: never bypass GPG commit signing</text>
  <text x="612" y="456" font-size="12" fill="#3fb950">signing: keyring auto-unlock ✓ (no prompts)</text>
  <text x="612" y="476" font-size="12" fill="#f85149">HARD: transcript = user-only, AI never reads</text>
  <text x="612" y="496" font-size="12" fill="#e6edf3">caveman mode always on · create_project</text>
  <text x="612" y="516" font-size="12" fill="#e6edf3">workflow (compact-first) · memory policy</text>

  <!-- ===== CRON GUARDS ===== -->
  <rect x="1110" y="338" width="360" height="196" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="1132" y="368" font-size="15" font-weight="bold" fill="#e6edf3">CRON GUARDS (×3)</text>
  <text x="1132" y="390" font-size="12" fill="#79c0ff">agents-symlink-guard @daily+@reboot</text>
  <text x="1132" y="410" font-size="12" fill="#8b949e">heals 3 AGENTS.md symlinks · flock'd</text>
  <text x="1132" y="430" font-size="12" fill="#79c0ff">merge-strays.sh @daily (AI merge)</text>
  <text x="1132" y="450" font-size="12" fill="#8b949e">headless LLM merges quarantined strays →</text>
  <text x="1132" y="468" font-size="12" fill="#8b949e">sanitize → append canonical → clear flag</text>
  <text x="1132" y="488" font-size="12" fill="#79c0ff">claude-memory-guard @daily+@reboot</text>
  <text x="1132" y="508" font-size="12" fill="#8b949e">Claude/Grok residue → archive+wipe</text>
  <text x="1132" y="526" font-size="12" fill="#8b949e">stages PENDING.md · grok memory deleted</text>
  <line x1="1110" y1="430" x2="1024" y2="430" stroke="#39d3e0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="1030" y="418" font-size="11" fill="#8b949e">heals</text>

  <!-- ===== SETUP ===== -->
  <rect x="130" y="338" width="360" height="196" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="152" y="368" font-size="15" font-weight="bold" fill="#e6edf3">FRESH MACHINE</text>
  <text x="152" y="392" font-size="13" fill="#3fb950">cp -r ~/.agents → bash setup.sh</text>
  <text x="152" y="416" font-size="12" fill="#8b949e">idempotent · backs up replaced files</text>
  <text x="152" y="436" font-size="12" fill="#8b949e">1 links 2 grok 3 wipe 4 hook 5 settings</text>
  <text x="152" y="456" font-size="12" fill="#8b949e">6 symlink guard 7 mem guard 7b updater</text>
  <text x="152" y="476" font-size="12" fill="#8b949e">7c stray-merge 8 cron 9 gpg hooks</text>
  <text x="152" y="496" font-size="12" fill="#79c0ff">updater/ = source · SETUP.md = spec</text>
  <text x="152" y="516" font-size="12" fill="#8b949e">git-versioned (private repo 1config)</text>
  <line x1="490" y1="436" x2="576" y2="436" stroke="#39d3e0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="510" y="424" font-size="11" fill="#8b949e">creates</text>

  <!-- ===== arrow hub -> project ===== -->
  <line x1="800" y1="534" x2="800" y2="596" stroke="#39d3e0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="812" y="560" font-size="11" fill="#8b949e">create_project → template · continue_project path → read compact/AGENTS/DECISIONS</text>
  <text x="812" y="578" font-size="11" fill="#8b949e">checkpoint_project → wrap-up (compact rewrite + transcript + ADRs) · residue merge</text>

  <!-- ===== PER-PROJECT STANDARD ===== -->
  <rect x="130" y="604" width="1340" height="452" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="800" y="638" text-anchor="middle" font-size="17" font-weight="bold" fill="#e6edf3">PER-PROJECT — AGENTS · compact · transcript · DECISIONS · .gitignore (NO CLAUDE.md)</text>

  <!-- AGENTS.md -->
  <rect x="160" y="662" width="627" height="108" rx="8" fill="#0d1117" stroke="#39d3e0" stroke-width="1.5"/>
  <text x="180" y="690" font-size="14" font-weight="bold" fill="#39d3e0">AGENTS.md</text>
  <text x="180" y="712" font-size="12" fill="#e6edf3">canonical + ONLY project rules file — all tools (Claude via hook)</text>
  <text x="180" y="732" font-size="12" fill="#8b949e">overview · stack · commands · gates · session-file pointers</text>
  <text x="180" y="752" font-size="12" fill="#8b949e">sites repos: kept local (not shipped)</text>

  <!-- DECISIONS.md -->
  <rect x="813" y="662" width="627" height="108" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <text x="833" y="690" font-size="14" font-weight="bold" fill="#e6edf3">docs/DECISIONS.md</text>
  <text x="833" y="712" font-size="12" fill="#e6edf3">ADR log — decision + why + rejected alternatives</text>
  <text x="833" y="732" font-size="12" fill="#8b949e">appended same turn a choice is made</text>
  <text x="833" y="752" font-size="12" fill="#3fb950">versioned — committed in repos ✓</text>

  <!-- session_compact -->
  <rect x="160" y="792" width="627" height="128" rx="8" fill="#0d1117" stroke="#3fb950" stroke-width="1.5"/>
  <text x="180" y="820" font-size="14" font-weight="bold" fill="#3fb950">session_compact.md — AI HANDOFF</text>
  <text x="180" y="842" font-size="12" fill="#e6edf3">read FIRST at session start · REWRITE at session end / milestone</text>
  <text x="180" y="862" font-size="12" fill="#8b949e">state · where we left off · next steps · key decisions · open issues</text>
  <text x="180" y="882" font-size="12" fill="#8b949e">Models used list = CUMULATIVE (model + effort, every switch logged)</text>
  <text x="180" y="902" font-size="12" fill="#d29922">local-only — never commit unless user says otherwise</text>

  <!-- session_transcript -->
  <rect x="813" y="792" width="627" height="128" rx="8" fill="#0d1117" stroke="#f85149" stroke-width="1.5"/>
  <text x="833" y="820" font-size="14" font-weight="bold" fill="#f85149">session_transcript.md — HUMAN ONLY</text>
  <text x="833" y="842" font-size="12" fill="#e6edf3">append-only narrative log, newest at bottom — written FOR the user</text>
  <text x="833" y="862" font-size="12" fill="#f85149">AI NEVER reads it unless user explicitly asks (HARD RULE)</text>
  <text x="833" y="882" font-size="12" fill="#8b949e">AI appends at milestones — writing OK, reading NOT</text>
  <text x="833" y="902" font-size="12" fill="#d29922">local-only — never commit unless user says otherwise</text>

  <!-- workflow strip -->
  <rect x="160" y="942" width="1280" height="90" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <text x="180" y="970" font-size="13" font-weight="bold" fill="#e6edf3">SESSION LOOP</text>
  <text x="330" y="970" font-size="12" fill="#8b949e">start: read compact → AGENTS.md → DECISIONS.md (never transcript)</text>
  <text x="330" y="992" font-size="12" fill="#8b949e">during: choice → ADR same turn · durable fact → AGENTS.md · milestone → append transcript</text>
  <text x="330" y="1014" font-size="12" fill="#8b949e">end / before compaction: REWRITE compact — fresh AI must resume from it alone</text>

  <!-- ===== GITHUB POLICY ===== -->
  <rect x="130" y="1080" width="1340" height="130" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="800" y="1112" text-anchor="middle" font-size="17" font-weight="bold" fill="#e6edf3">GITHUB POLICY</text>
  <text x="160" y="1140" font-size="12" fill="#e6edf3">projects: only <tspan fill="#79c0ff">~/projects/sites/*</tspan> repos live on GitHub (FirstIntegral) — exception: MSc coursework repo</text>
  <text x="160" y="1162" font-size="12" fill="#e6edf3">this setup: <tspan fill="#79c0ff">~/.agents → 1config</tspan> (private) · note/session files NEVER pushed</text>
  <text x="160" y="1184" font-size="12" fill="#f85149">every commit GPG-signed (95FBA6E0AA245342, keyring auto-unlock) · no AI attribution ever</text>

  <!-- ===== PROJECTS ROW ===== -->
  <rect x="130" y="1234" width="1340" height="176" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="800" y="1266" text-anchor="middle" font-size="17" font-weight="bold" fill="#e6edf3">~/projects/ — all on the standard since 2026-07-26</text>
  <text x="160" y="1296" font-size="12" fill="#79c0ff">sites/</text>
  <text x="240" y="1296" font-size="12" fill="#8b949e">actdebug (public) · caliberdex · polygonrizz · siegedraw · whendoesstompnplay (private) — GitHub + GPG</text>
  <text x="160" y="1320" font-size="12" fill="#79c0ff">research</text>
  <text x="240" y="1320" font-size="12" fill="#8b949e">darboux-ml-integrability · first-integrals-ai · opencode-first-integral — local only, no remotes</text>
  <text x="160" y="1344" font-size="12" fill="#79c0ff">other</text>
  <text x="240" y="1344" font-size="12" fill="#8b949e">movement-specs · human-communication/philosophy · master's thesis (container) · random (container)</text>
  <text x="160" y="1376" font-size="12" fill="#d29922">rule: nothing outside sites/ gets a GitHub remote (exception: this setup, 1config) · new project ⇒ say create_project</text>

  <!-- ===== footer ===== -->
  <text x="800" y="1448" text-anchor="middle" font-size="13" fill="#8b949e">memory: shared markdown only · cron memory-guard stages residue · AI merges into AGENTS/compact/DECISIONS</text>
  <text x="800" y="1472" text-anchor="middle" font-size="13" fill="#8b949e">stray symlink conflicts: LLM-merged automatically · tool stores wiped (claude stub-only, grok deleted)</text>
  <text x="800" y="1504" text-anchor="middle" font-size="14" fill="#39d3e0">migrate: cp -r ~/.agents/ → bash ~/.agents/setup.sh → done</text>
</svg>
